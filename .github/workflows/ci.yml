name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect data/** changes
        id: data-changed
        uses: dorny/paths-filter@v3
        with:
          filters: |
            data:
              - 'data/**'
              - 'scripts/data/**'
              - 'scripts/gates/**'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Lint tokens
        run: npm run lint:tokens

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Data gates (schema/structural/coverage/size — golden tests already ran above)
        if: steps.data-changed.outputs.data == 'true'
        run: npm run data:gates -- --patch "$(node -p "require('./data/current.json').patch")" --skip-golden

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
